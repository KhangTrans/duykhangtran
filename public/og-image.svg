<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dot Pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(59,130,246,0.2)"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Decorative Shapes -->
  <circle cx="100" cy="100" r="120" fill="rgba(59,130,246,0.1)" opacity="0.5"/>
  <circle cx="1100" cy="530" r="150" fill="rgba(139,92,246,0.1)" opacity="0.5"/>
  <rect x="900" y="50" width="200" height="200" rx="20" fill="rgba(236,72,153,0.08)" opacity="0.6"/>
  
  <!-- Accent Line -->
  <rect x="100" y="200" width="1000" height="5" fill="url(#accentGrad)" rx="2.5"/>
  
  <!-- Avatar Section -->
  <defs>
    <clipPath id="avatarClip">
      <circle cx="950" cy="350" r="80"/>
    </clipPath>
  </defs>
  
  <!-- Avatar Border (Gradient Ring) -->
  <circle cx="950" cy="350" r="85" fill="url(#accentGrad)"/>
  <circle cx="950" cy="350" r="82" fill="#0f172a"/>
  
  <!-- Avatar Image - Embedded as base64 or external -->
  <image href="data:image/jpeg;base64,/9j/4AAQSkZJRg..." x="870" y="270" width="160" height="160" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Fallback: If image doesn't load, show initial -->
  <circle cx="950" cy="350" r="80" fill="url(#accentGrad)" opacity="0"/>
  <text x="950" y="380" font-family="'Inter', 'Arial', sans-serif" font-size="60" font-weight="800" fill="white" text-anchor="middle" opacity="0">
    K
  </text>
  
  <!-- Content Container -->
  <g>
    <!-- Name -->
    <text x="100" y="300" font-family="'Inter', 'Arial', sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-1">
      TRAN DUY KHANG
    </text>
    
    <!-- Role with gradient -->
    <text x="100" y="360" font-family="'Inter', 'Arial', sans-serif" font-size="32" font-weight="600" fill="url(#accentGrad)">
      Frontend Developer
    </text>
    
    <!-- Tech Stack -->
    <g transform="translate(100, 410)">
      <!-- React Badge -->
      <rect x="0" y="0" width="100" height="36" rx="18" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="2"/>
      <text x="50" y="24" font-family="'Inter', 'Arial', sans-serif" font-size="16" font-weight="600" fill="#60a5fa" text-anchor="middle">
        React
      </text>
      
      <!-- Node Badge -->
      <rect x="120" y="0" width="100" height="36" rx="18" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="2"/>
      <text x="170" y="24" font-family="'Inter', 'Arial', sans-serif" font-size="16" font-weight="600" fill="#a78bfa" text-anchor="middle">
        Node.js
      </text>
      
      <!-- TypeScript Badge -->
      <rect x="240" y="0" width="130" height="36" rx="18" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="2"/>
      <text x="305" y="24" font-family="'Inter', 'Arial', sans-serif" font-size="16" font-weight="600" fill="#f472b6" text-anchor="middle">
        TypeScript
      </text>
    </g>
    
    <!-- Website URL -->
    <g transform="translate(100, 520)">
      <text x="0" y="0" font-family="'Inter', 'Arial', sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.6)">
        🌐 duykhangtran.vercel.app
      </text>
    </g>
    
    <!-- GitHub Link -->
    <g transform="translate(950, 520)">
      <text x="0" y="0" font-family="'Inter', 'Arial', sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.5)">
        github.com/KhangTrans
      </text>
    </g>
  </g>
</svg>
